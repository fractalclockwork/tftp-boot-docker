server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # Large live artifacts — support Range requests for PXE/casper clients
    location /iso/ {
        alias /data/iso/;
        autoindex on;
        sendfile on;
        tcp_nopush on;
    }

    # Extracted live tree (casper/, etc.) from scripts/extract-live.sh
    location /live/ {
        alias /var/www/html/live/;
        autoindex on;
        sendfile on;
        tcp_nopush on;
    }

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }
}
